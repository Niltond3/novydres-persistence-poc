name: NOVYDRES CHR-001 NPC Social Horror V3 Regression
on:
  push:
    paths:
      - '.github/workflows/novydres-social-horror-v3.yml'
      - 'novydres/chronicles/CHR-001/npc-disposition/EVALUATOR_V2.mjs'
      - 'novydres/chronicles/CHR-001/npc-disposition/TESTS_V3.mjs'
      - 'novydres/chronicles/CHR-001/npc-disposition/CONTRACT_V2.md'
      - 'novydres/chronicles/CHR-001/narrative-tone/**'
  pull_request:
    paths:
      - '.github/workflows/novydres-social-horror-v3.yml'
      - 'novydres/chronicles/CHR-001/npc-disposition/**'
      - 'novydres/chronicles/CHR-001/narrative-tone/**'
permissions:
  contents: read
jobs:
  validate-new-local-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run new v3 regression tests (not the historical C15 reactivation gate)
        run: node --test novydres/chronicles/CHR-001/npc-disposition/TESTS_V3.mjs
      - name: Confirm local contracts are on disk and next_role remains NONE
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const M=JSON.parse(fs.readFileSync('novydres/MANIFEST_V42.json','utf8'));
          const C=JSON.parse(fs.readFileSync('novydres/chronicles/CHR-001/orchestration/CYCLE_V0020.json','utf8'));
          for (const p of [M.runtime.npc_disposition_current.contract,M.runtime.npc_disposition_current.evaluator,
            M.runtime.chr001_tone_current.contract,M.runtime.orchestration.role_narrador,
            M.runtime.orchestration.role_dramaturgo]) if(!fs.existsSync(p)) throw Error('Missing contract '+p);
          if(C.next_role!=='NONE'||C.status!=='PROVOCATION_CLOSURE_PENDING') throw Error('Narrative gate unexpectedly opened');
          "
