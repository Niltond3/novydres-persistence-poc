name: NOVYDRES CHR-001 Living Ellipses Temporal Governance V15 Gate
on:
  push:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/runtime/scene-execution/**'
      - 'novydres/runtime/narrative-architecture/program/decisions/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/chronicles/CHR-001/preparations/**'
      - 'novydres/MANIFEST_V*.json'
      - '.github/workflows/novydres-temporal-governance-v15.yml'
  pull_request:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/runtime/scene-execution/**'
      - 'novydres/runtime/narrative-architecture/program/decisions/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/chronicles/CHR-001/preparations/**'
      - 'novydres/MANIFEST_V*.json'
      - '.github/workflows/novydres-temporal-governance-v15.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python3 -m pip install 'jsonschema>=4.18,<5'
      - name: Temporal modes continuity world advancement and prelude negative tests
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V15.mjs
      - name: Validate V15 schema and temporal negative fixtures
        run: python3 novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V15.py .
      - name: Validate 41-cycle SHA chain and manifest with no simulated events
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V15.mjs --root .
