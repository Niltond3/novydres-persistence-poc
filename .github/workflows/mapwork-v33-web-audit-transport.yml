name: Mapwork candidate source transfer (temporary diagnostic only)
on:
  push:
    branches: ['mapwork-v3/v33-agent-pipeline-20261120']
    paths: ['.github/workflows/mapwork-v33-web-audit-transport.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack read-only source to artifact, no pipeline runs
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/web-candidate-source.tar.gz" novydres/AGENTS.md novydres/CONTEXT.md novydres/catalogo.json novydres/cenario/atlas-novydres/cartografia/mapwork-v3
      - uses: actions/upload-artifact@v4
        with:
          name: mapwork-v33-web-audit-source
          path: ${{ runner.temp }}/web-candidate-source.tar.gz
          retention-days: 1
          if-no-files-found: error
