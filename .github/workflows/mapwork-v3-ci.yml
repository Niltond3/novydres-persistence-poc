name: Mapwork V3 contracts and spatial regression
on:
  pull_request:
    branches: [master]
    paths:
      - 'novydres/cenario/atlas-novydres/cartografia/mapwork-v3/**'
      - '.github/workflows/mapwork-v3-ci.yml'
  push:
    branches: [master, 'mapwork/**', 'mapwork-v3/**']
    paths:
      - 'novydres/cenario/atlas-novydres/cartografia/mapwork-v3/**'
      - '.github/workflows/mapwork-v3-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapwork-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic validator dependencies
        run: python -m pip install -r novydres/cenario/atlas-novydres/cartografia/mapwork-v3/requirements.txt
      - name: Validate repository contracts and candidate manifests
        run: python novydres/cenario/atlas-novydres/cartografia/mapwork-v3/scripts/mapwork.py audit
      - name: Run geometry, mask, tiles and before/after integration tests
        run: python -m pytest -q novydres/cenario/atlas-novydres/cartografia/mapwork-v3/tests
