name: ADR-001 C/D candidate checks (non-operational)
on:
  push:
    branches:
      - design/subject-oriented-migration
    paths:
      - 'novydres/scripts/validar-assuntos.mjs'
      - 'novydres/scripts/testar-validacao-assuntos.test.mjs'
      - 'novydres/scripts/catalogo-assuntos.mjs'
      - 'novydres/scripts/testar-catalogo-assuntos.test.mjs'
      - 'novydres/scripts/retomar-estado.mjs'
      - 'novydres/scripts/testar-retomada-estado.test.mjs'
      - 'novydres/scripts/auditar-legado-e-fontes.mjs'
      - 'novydres/scripts/testar-auditoria-legado.test.mjs'
      - 'novydres/scripts/revisar-conducao-candidata.mjs'
      - 'novydres/scripts/testar-conducao-candidata.test.mjs'
      - 'novydres/scripts/testar-fluxo-integrado.test.mjs'
      - 'novydres/scripts/verificar-inventario-d01.mjs'
      - 'novydres/scripts/testar-inventario-d01.test.mjs'
      - 'novydres/sistema/arquitetura/fase-d/**'
      - 'novydres/sistema/narrativa/**'
      - 'novydres/cronicas/CHR-001/configuracao/**'
      - 'novydres/sistema/arquitetura/fase-b/resultado-testes.json'
      - 'novydres/sistema/arquitetura/fase-b/gate-e-readback.json'
      - 'novydres/catalogo.json'
      - 'novydres/AGENTS.md'
      - 'novydres/CONTEXT.md'
      - 'novydres/sistema/arquitetura/fase-a/schemas/**'
      - '.github/workflows/adr001-phase-c-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c01-validators:
    if: github.ref == 'refs/heads/design/subject-oriented-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # read historical commit/path/blob; no source snapshots mixed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate source bindings and V01–V04
        run: node novydres/scripts/validar-assuntos.mjs
      - name: Exercise deterministic and negative cases
        run: node --test novydres/scripts/testar-validacao-assuntos.test.mjs
      - name: Check derived catalog byte identity and V09 content hash
        run: node novydres/scripts/catalogo-assuntos.mjs --check
      - name: Test V03 exact snapshot retrieval and V09 invalidation
        run: node --test novydres/scripts/testar-catalogo-assuntos.test.mjs
      - name: Test V06-V07 fixed historical state and guarded recovery
        run: node --test novydres/scripts/testar-retomada-estado.test.mjs
      - name: Check C04 standalone candidate recovery from pinned source blobs
        run: node novydres/scripts/retomar-estado.mjs
      - name: Audit all HEAD paths and pending source media without claiming cutover
        run: node novydres/scripts/auditar-legado-e-fontes.mjs
      - name: Test V08 V11 V12 strict final rejection and negative fixture coverage
        run: node --test novydres/scripts/testar-auditoria-legado.test.mjs
      - name: C05 optional fiction-risk diagnostics and reuse independent contextual review
        run: node --test novydres/scripts/testar-conducao-candidata.test.mjs
      - name: C07 integrated exact-snapshot flow and scoped local measurements
        run: node --test novydres/scripts/testar-fluxo-integrado.test.mjs
      - name: D01 verify source/candidate Git objects and external registry pins
        run: node novydres/scripts/verificar-inventario-d01.mjs
      - name: D01 negative regressions for full inventory, SHA and editorial gate
        run: node --test novydres/scripts/testar-inventario-d01.test.mjs
