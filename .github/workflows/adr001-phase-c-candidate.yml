name: ADR-001 D consolidated candidate validation
on:
  push:
    branches: [design/subject-oriented-migration]
    paths:
      - 'novydres/sistema/arquitetura/fase-d/d06-freeze.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-D:
    if: github.ref == 'refs/heads/design/subject-oriented-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all subject owners and pinned sources
        run: node novydres/scripts/validar-assuntos.mjs
      - name: Verify exact generated catalog
        run: node novydres/scripts/catalogo-assuntos.mjs --check
      - name: C45 source snapshot and resource readback
        run: node novydres/scripts/verificar-estado-d04.mjs
      - name: D04 all 438 original sources and negatives
        run: node --test novydres/scripts/testar-custodia-d04.test.mjs
      - name: C45 current state and actors negative tests
        run: node --test novydres/scripts/testar-estado-d04.test.mjs novydres/scripts/testar-retomar-cronica.test.mjs
      - name: Zero legacy final on entire HEAD
        run: node novydres/scripts/auditar-legado-e-fontes.mjs --final
      - name: D06 source and structural scope with negative tests
        run: node --test novydres/scripts/testar-integridade-d06.test.mjs
      - name: D07 separate direct source and actor review
        run: node --test novydres/scripts/testar-revisao-d07.test.mjs
      - name: D06 full factual report without false gate claim
        run: node novydres/scripts/verificar-integridade-d06.mjs
      - name: D07 independent structural review without editorial certification
        run: node novydres/scripts/revisar-independente-d07.mjs
      - name: D06 final gate requires semantic and runtime approval
        run: node novydres/scripts/verificar-integridade-d06.mjs --require-pass
      - name: D07 final independent gate
        run: node novydres/scripts/revisar-independente-d07.mjs --require-pass
