name: NOVYDRES CHR-001 NPC Disposition (local)
on:
  push:
    paths:
      - 'novydres/chronicles/CHR-001/npc-disposition/**'
      - '.github/workflows/novydres-npc-disposition.yml'
  pull_request:
    paths:
      - 'novydres/chronicles/CHR-001/npc-disposition/**'
      - 'novydres/chronicles/CHR-001/LIVE_v*.json'
      - '.github/workflows/novydres-npc-disposition.yml'
permissions:
  contents: read
jobs:
  test-local-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar matemática, humor, autonomia e regressões
        run: node --test novydres/chronicles/CHR-001/npc-disposition/TESTS_V1.mjs novydres/chronicles/CHR-001/npc-disposition/TESTS_V2.mjs
      - name: Validar estado atual e ancoragem em CYCLE
        run: node novydres/chronicles/CHR-001/npc-disposition/VALIDATOR_V1.mjs --root . --state novydres/chronicles/CHR-001/npc-disposition/STATE_V001.json
      - name: Validar ativação local C15 sem alterar ciclo ou LIVE
        run: node novydres/chronicles/CHR-001/npc-disposition/VALIDATOR_V2.mjs --root .
