name: NOVYDRES CHR-001 C02 Prospective Causal Preflight V21
on:
  push:
    paths:
      - '.github/workflows/novydres-m302-c02-preflight-v21.yml'
      - 'novydres/runtime/orchestration/*V21*'
      - 'novydres/chronicles/CHR-001/preparations/M3.02_*_V5.json'
      - 'novydres/runtime/provocation-prep/*V11*'
  pull_request:
    paths:
      - '.github/workflows/novydres-m302-c02-preflight-v21.yml'
      - 'novydres/runtime/orchestration/*V21*'
      - 'novydres/chronicles/CHR-001/preparations/M3.02_*_V5.json'
permissions:
  contents: read
jobs:
  causal_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Actor knowledge, C44 pins, 44 threads, causal negatives
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_PREFLIGHT_TESTS_V21.mjs
      - name: V11 schemas and negative cases
        run: python novydres/runtime/orchestration/ORCHESTRATION_PREFLIGHT_SCHEMA_TESTS_V21.py
      - name: Causal preflight direct validator
        run: node novydres/runtime/orchestration/ORCHESTRATION_PREFLIGHT_V21.mjs
