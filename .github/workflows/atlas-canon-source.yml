name: Atlas canonical source consistency
on:
  push:
    branches:
      - design/atlas-unificar-fontes
      - design/atlas-cartografia
      - master
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  atlas-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ADR-001 catalog and regression
        run: |
          node novydres/scripts/validar-assuntos.mjs
          node novydres/scripts/catalogo-assuntos.mjs --check
          node --test novydres/scripts/testar-integridade-d06.test.mjs
      - name: Verify unique canonical values and absence of retired Atlas sources
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const root='novydres/cenario/atlas-novydres/';
          const j=f=>JSON.parse(readFileSync(root+f,'utf8'));
          for(const f of ['fonte-001.source.md','fonte-002.source.md','registro.json','segmentos.json'])
            assert.equal(existsSync(root+f),false,f+' remains in HEAD');
          const p=j('populacao-2010.json'),l=j('localizacao-geral-2010.json');
          assert.equal(p.population.value,7000000);
          assert.equal(p.canonical_status,'CLOSED_CANON');
          assert.equal(l.fact_id,'GEO-002.1');
          assert.equal(l.canonical_status,'CLOSED_CANON');
          assert.deepEqual(l.approved_subdecisions,['GEO-002.1','GEO-002.2','GEO-002.3']);
          assert.equal(l.location.territorial_configuration.primary_urban_footprint,'continental');
          assert.equal(l.location.territorial_configuration.coastal_city,true);
          assert.equal(l.location.territorial_configuration.secondary_islands,true);
          assert.equal(l.location.territorial_configuration.coastal_bays_or_peninsulas.main_feature,'grande baía natural de acesso marítimo');
          assert.equal(l.location.territorial_configuration.coastal_bays_or_peninsulas.bay_is_secondary_to_continental_territory,true);
          assert.equal(l.location.territorial_configuration.land_water_system.natural_rivers_present,true);
          assert.equal(l.location.territorial_configuration.land_water_system.natural_lagoons_present,true);
          const geo=j('geotermia-aquecimento-2010.json');
          assert.deepEqual(geo.fact_ids,['GEO-002.3/TERMAS','GEO-003.1','GEO-014.1']);
          assert.equal(geo.geology.deep_groundwater_circulation,true);
          assert.equal(geo.geology.active_surface_volcano_required,false);
          assert.equal(geo.resource_geography.main_concentration_toponym,'Cidade Velha');
          const ermo=j('ermos-estrutura-territorial-2010.json');
          const growth=JSON.parse(readFileSync('novydres/cenario/historia-global/formacao-policentrica-2010.json','utf8'));
          assert.equal(ermo.fact_id,'GEO-004.3');
          assert.equal(ermo.canonical_status,'CLOSED_CANON_SCOPED');
          assert.equal(ermo.territorial_structure.administrative_category,'zona territorial natural especial, não um raion');
          assert.equal(ermo.territorial_structure.raion_count_unchanged,9);
          assert.equal(ermo.cartographic_constraints.prohibit_default_continuous_urban_mass,true);
          assert.equal(ermo.cartographic_constraints.prohibit_radial_even_growth_by_default,true);
          assert.equal(ermo.transit_policy.crossing_does_not_imply_conurbation,true);
          assert.deepEqual(growth.fact_ids,['GEO-005.1','GEO-005.2']);
          assert.equal(growth.canonical_status,'CLOSED_CANON_SCOPED');
          assert.equal(growth.growth_model.single_radiating_city_center,false);
          assert.equal(growth.growth_model.some_conurbations_possible,true);
          assert.equal(growth.historical_allocation_planning.status,'CANON_APPROVED_GEO-005.2');
          assert.equal(growth.historical_allocation_planning.responsible_founder,'Gilgamesh');
          assert.equal(growth.historical_allocation_planning.approved_assignment_of_individual_clans,false);
          assert.equal(growth.historical_allocation_planning.approved_emissary_names,false);
          assert.equal(growth.historical_allocation_planning.approved_exact_historical_fief_to_modern_raion_mapping,false);
          assert.equal(growth.historical_allocation_planning.assignment_criteria.length,4);
          for(const x of ['dunwich','levi','alexandria','chelsea','bukovie','new-london','sulfok','drevnigrad','vasyl-bay']){
            const i=readFileSync('novydres/cenario/geografia/district-'+x+'/index.md','utf8');
            assert.ok(i.includes('GEO-005.2'),x);
            assert.ok(i.includes('formacao-policentrica-2010.json'),x);
          }
          assert.equal(growth.growth_model.barriers_reference,root+'ermos-estrutura-territorial-2010.json');
          const raions=j('raions-oficiais-2010.json');
          assert.equal(raions.fact_id,'GEO-004.2');
          assert.equal(raions.canonical_status,'CLOSED_CANON_SCOPED');
          assert.equal(raions.official_raion_count,9);
          const officialNames=['Dunwich','Levi','Alexandria','Chelsea','Bukovie','New London','Sulfok','Drevnigrad','Vasyl Bay'];
          assert.deepEqual(raions.raions.map(x=>x.official_name),officialNames);
          assert.equal(new Set(raions.raions.map(x=>x.subject_id)).size,9);
          for(const x of raions.raions){
            const d=JSON.parse(readFileSync('novydres/cenario/geografia/'+x.subject_id+'/conteudo.json','utf8'));
            assert.equal(d.canonical_identity_reference.source_of_truth,root+'raions-oficiais-2010.json',x.subject_id);
            assert.equal(x.geometry,null,x.subject_id);
            const idx=readFileSync('novydres/cenario/geografia/'+x.subject_id+'/index.md','utf8');
            assert.ok(idx.includes('ermos-estrutura-territorial-2010.json'),x.subject_id);
            assert.ok(idx.includes('formacao-policentrica-2010.json'),x.subject_id);
          }
          const oldTown=JSON.parse(readFileSync('novydres/cenario/geografia/district-chelsea/cidade-velha-2010.json','utf8'));
          assert.equal(oldTown.fact_id,'GEO-004.1');
          assert.equal(oldTown.canonical_status,'CLOSED_CANON_SCOPED');
          assert.equal(oldTown.feature.parent_raion_subject_id,'district-chelsea');
          assert.equal(oldTown.feature.is_entire_raion,false);
          assert.equal(oldTown.feature.geometry,null);
          assert.equal(geo.resource_geography.administrative_mapping.canonical_status,'CONFIRMED_GEO-004.1');
          assert.equal(geo.resource_geography.administrative_mapping.canonical_ref,'novydres/cenario/geografia/district-chelsea/cidade-velha-2010.json');
          assert.equal(geo.district_heating.service_distribution,'UNEQUAL_CITYWIDE');
          assert.equal(l.location.territorial_configuration.land_water_system.geothermal_canon_ref,'geotermia-aquecimento-2010.json');
          assert.equal(l.location.territorial_configuration.land_water_system.geothermal_springs_present,undefined);
          assert.equal(l.location.coastline_geometry,null);
          assert.equal(existsSync(root+'atlas-proposta.md'),true);
          const proposal=readFileSync(root+'atlas-proposta.md','utf8');
          assert.ok(!proposal.includes('mais de oito milhões'));
          for(const f of ['alexandria','bukovie','chelsea','drevnigrad','dunwich','levi','new-london','sulfok','vasyl-bay']){
            const d=JSON.parse(readFileSync('novydres/cenario/geografia/district-'+f+'/conteudo.json','utf8'));
            assert.equal(d.source_variants?.length,1);
            assert.equal(d.source_variants[0].source_path,root+'atlas-proposta.md');
          }
          for(let i=1;i<=32;i++){
            const d=JSON.parse(readFileSync('novydres/cenario/lugares/poi-'+String(i).padStart(2,'0')+'/conteudo.json','utf8'));
            assert.equal(d.source_variants?.length,1);
            assert.equal(d.source_variants[0].source_path,root+'atlas-proposta.md');
          }
          for(const sub of ['district-alexandria','district-bukovie','district-chelsea','district-drevnigrad','district-dunwich','district-levi','district-new-london','district-sulfok','district-vasyl-bay']){
            const idx=readFileSync('novydres/cenario/geografia/'+sub+'/index.md','utf8');
            assert.ok(!idx.includes('duas variantes'),sub);
          }
          for(let i=1;i<=32;i++){
            const idx=readFileSync('novydres/cenario/lugares/poi-'+String(i).padStart(2,'0')+'/index.md','utf8');
            assert.ok(!idx.includes('duas variantes'),'poi-'+i);
          }
          import { createHash } from 'node:crypto';
          const src=readFileSync(root+'atlas-proposta.md','utf8');
          const srcBytes=Buffer.from(src,'utf8');
          const sourceBlob=createHash('sha1').update(Buffer.concat([Buffer.from('blob '+srcBytes.length+'\0'),srcBytes])).digest('hex');
          for(const name of ['alexandria','bukovie','chelsea','drevnigrad','dunwich','levi','new-london','sulfok','vasyl-bay']){
            const q=JSON.parse(readFileSync('novydres/cenario/geografia/district-'+name+'/conteudo.json','utf8'));
            assert.equal(q.source_variants[0].source_blob_sha,sourceBlob,name);
          }
          for(let i=1;i<=32;i++){
            const q=JSON.parse(readFileSync('novydres/cenario/lugares/poi-'+String(i).padStart(2,'0')+'/conteudo.json','utf8'));
            assert.equal(q.source_variants[0].source_blob_sha,sourceBlob,'poi-'+i);
          }
          console.log('Atlas single-current-source PASS');
          NODE
      - name: No obsolete municipal population claims in current tree
        run: |
          if git grep -niE 'mais de (oito|8) milhões|>8 milhões|8,4 milhões|8\.400\.000' -- novydres; then
            echo "Obsolete population claim remains in active HEAD" >&2
            exit 1
          fi
          echo "No obsolete population statements in current HEAD"
