name: NOVYDRES CHR-001 Causal Entry V13 Gate
on:
  push:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/chronicles/CHR-001/preparations/**'
      - 'novydres/MANIFEST_V*.json'
      - '.github/workflows/novydres-causal-entry-v13.yml'
  pull_request:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/chronicles/CHR-001/preparations/**'
      - 'novydres/MANIFEST_V*.json'
      - '.github/workflows/novydres-causal-entry-v13.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON schema validator
        run: python3 -m pip install 'jsonschema>=4.18,<5'
      - name: Causal and agency regression tests including negative fixtures
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V13.mjs
      - name: Validate schema and negative fixtures
        run: python3 novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V13.py .
      - name: Validate exact pins, chain, Git tree, and intent-only gates
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V13.mjs --root .
