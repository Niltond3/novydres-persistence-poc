name: NOVYDRES CHR-001 Orchestration Gate
on:
  push:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/MANIFEST_V*.json'
      - '.github/workflows/novydres-orchestration.yml'
  pull_request:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/MANIFEST_V*.json'
      - '.github/workflows/novydres-orchestration.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar transições permitidas e negadas
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V1.mjs
      - name: Validar último ciclo versionado e proveniência
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V1.mjs --root .
