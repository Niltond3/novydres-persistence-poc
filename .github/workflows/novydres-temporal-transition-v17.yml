name: NOVYDRES CHR-001 Temporal Source Reconciliation V17
on:
  push:
    paths:
      - 'novydres/runtime/orchestration/*V17*'
      - 'novydres/runtime/orchestration/START_HERE_V14.md'
      - 'novydres/runtime/orchestration/ORCHESTRATION_CONTRACT_V15.md'
      - 'novydres/runtime/orchestration/HANDOFF_DRAMATURGO_TO_NARRADOR_V4.md'
      - 'novydres/chronicles/CHR-001/orchestration/CYCLE_V0043.json'
      - 'novydres/MANIFEST_V58.json'
      - '.github/workflows/novydres-temporal-transition-v17.yml'
  pull_request:
    paths:
      - 'novydres/runtime/orchestration/*V17*'
      - 'novydres/chronicles/CHR-001/orchestration/CYCLE_V0043.json'
      - 'novydres/MANIFEST_V58.json'
permissions:
  contents: read
jobs:
  reconcile_v17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: 44-thread temporal packet V2 and adversarial regression
        run: node --test novydres/runtime/scene-execution/TEMPORAL_TRANSITION_TESTS_V2.mjs
      - name: Temporal JSON schema V2
        run: python novydres/runtime/scene-execution/TEMPORAL_TRANSITION_SCHEMA_TESTS_V2.py
      - name: Successor C43 regression and 42-link SHA chain
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V17.mjs
      - name: V17 cycle JSON schema and negative vectors
        run: python novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V17.py
      - name: Readback manifest and every pin, verify no G28
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V17.mjs --root .
