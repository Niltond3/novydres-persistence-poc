name: NOVYDRES CHR-001 Post-G28 Current Scope V20
on:
  push:
    paths:
      - '.github/workflows/novydres-m302-post-g28-v20.yml'
      - 'novydres/runtime/orchestration/*V20*'
      - 'novydres/chronicles/CHR-001/audits/M3.02_POST_G28_CI_SCOPE_AUDIT_V1_PLAYER_SAFE.json'
      - 'novydres/chronicles/CHR-001/reviews/M3.02_POST_C01_REVIEW_STATUS_V3_PLAYER_SAFE.md'
      - 'novydres/MANIFEST_V62.json'
  pull_request:
    paths:
      - '.github/workflows/novydres-m302-post-g28-v20.yml'
      - 'novydres/runtime/orchestration/*V20*'
      - 'novydres/MANIFEST_V62.json'
permissions:
  contents: read
jobs:
  current_post_g28_v20:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Exact SHA readback
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: V20 current scope and negative vectors
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V20.mjs
      - name: V20 validator with exact source SHA pins
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V20.mjs
      - name: V19 post-G28 source semantics and 20 negatives
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V19.mjs
      - name: V10 schemas with 18 negatives
        run: python novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V19.py
      - name: Preserve C44 V18 validation and its negatives
        run: |
          node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V18.mjs
          python novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V18.py
      - name: Temporal packet V2 regression and schema
        run: |
          node --test novydres/runtime/scene-execution/TEMPORAL_TRANSITION_TESTS_V2.mjs
          python novydres/runtime/scene-execution/TEMPORAL_TRANSITION_SCHEMA_TESTS_V2.py
