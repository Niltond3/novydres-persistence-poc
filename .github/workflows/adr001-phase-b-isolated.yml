name: ADR-001 B04 isolated regression (non-operational)
on:
  push:
    branches:
      - design/subject-oriented-migration
    paths:
      - 'novydres/sistema/arquitetura/fase-b/**'
      - 'novydres/sistema/arquitetura/adr/**'
      - 'novydres/sistema/arquitetura/plano-integral/**'
      - 'novydres/sistema/arquitetura/fase-a/**'
      - 'novydres/sistema/arquitetura/simplificacao-narrativa/**'
      - '.github/workflows/adr001-phase-b-isolated.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-tests:
    if: github.ref == 'refs/heads/design/subject-oriented-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic regression and real GitHub disposable-ref proof
        env:
          ADR001_REMOTE_PROOF: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node novydres/sistema/arquitetura/fase-b/executor-isolado.mjs
      - name: Score frozen B03 outputs without exposing source answers in logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node novydres/sistema/arquitetura/fase-b/avaliador-pos-congelamento.mjs
