name: ADR-001 C03 isolated Git transaction proof (non-operational)
on:
  push:
    branches:
      - design/subject-oriented-migration
    paths:
      - 'novydres/scripts/transacao-git.mjs'
      - 'novydres/scripts/testar-transacao-git.test.mjs'
      - '.github/workflows/adr001-phase-c03-transaction.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-c03:
    if: github.ref == 'refs/heads/design/subject-oriented-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise C03 real remote disposable ref, no campaign writes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test novydres/scripts/testar-transacao-git.test.mjs
