name: NOVYDRES CHR-001 G28 Scene-End V18
on:
  push:
    paths:
      - 'novydres/runtime/orchestration/*V18*'
      - 'novydres/runtime/orchestration/START_HERE_V15.md'
      - 'novydres/runtime/orchestration/ORCHESTRATION_CONTRACT_V17.md'
      - 'novydres/chronicles/CHR-001/orchestration/CYCLE_V0044.json'
      - 'novydres/MANIFEST_V59.json'
      - '.github/workflows/novydres-scene-end-v18.yml'
  pull_request:
    paths:
      - 'novydres/runtime/orchestration/*V18*'
      - 'novydres/chronicles/CHR-001/orchestration/CYCLE_V0044.json'
      - 'novydres/MANIFEST_V59.json'
permissions:
  contents: read
jobs:
  scene_end_g28:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: G28 scene and predecessor regression
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V18.mjs
      - name: G28 JSON schema and negative tests
        run: python novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V18.py
      - name: Exact SHA pins and scene-end readback
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V18.mjs --root .
