name: NOVYDRES CHR-001 Marco Closure V2
# Historical gate: V2 applies only while its original cycle schema is the latest.
# Later cycle successors must be checked by their own validator; forcing V2 latest would
# incorrectly reject valid later cycles. V2 tests and validator remain unmodified.
on:
  push:
    paths:
      - 'novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V2.mjs'
      - 'novydres/runtime/orchestration/ORCHESTRATION_TESTS_V2.mjs'
      - 'novydres/runtime/orchestration/CYCLE_SCHEMA_V2.json'
      - 'novydres/runtime/orchestration/MARCO_CLOSURE_CONTRACT_V1.md'
      - 'novydres/chronicles/CHR-001/orchestration/CYCLE_V0021.json'
      - 'novydres/chronicles/CHR-001/admin/M2_FORMAL_MARCO_CLOSURE_V1.json'
      - 'novydres/chronicles/CHR-001/world/**'
      - '.github/workflows/novydres-marco-closure-v2.yml'
  pull_request:
    paths:
      - 'novydres/runtime/orchestration/**'
      - 'novydres/chronicles/CHR-001/orchestration/**'
      - 'novydres/chronicles/CHR-001/admin/M2_FORMAL_MARCO_CLOSURE_V1.json'
      - '.github/workflows/novydres-marco-closure-v2.yml'
permissions:
  contents: read
jobs:
  validate-closed-marco-and-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine applicability of historical V2 gate
        id: applicability
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const dir = "novydres/chronicles/CHR-001/orchestration";
            const nums = fs.readdirSync(dir).map(f => /^CYCLE_V(\d{4})\.json$/.exec(f)).filter(Boolean).map(m => Number(m[1]));
            const n = Math.max(...nums);
            const latest = JSON.parse(fs.readFileSync(path.join(dir, "CYCLE_V" + String(n).padStart(4, "0") + ".json")));
            const applicable = latest.schema_id === "NOVYDRES_CHR001_ORCHESTRATION_CYCLE_V2";
            console.log("Historical V2 validator: " + (applicable ? "APPLICABLE" : "NOT_APPLICABLE_TO_CURRENT_CYCLE") + " (cycle " + n + ", " + latest.schema_id + ")");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "applicable=" + String(applicable) + "\n");
          '
      - name: Marco V2 pure regressions and close/next-role check
        if: steps.applicability.outputs.applicable == 'true'
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V2.mjs
      - name: Verify latest V2 cycle, predecessor blobs and LIVE
        if: steps.applicability.outputs.applicable == 'true'
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V2.mjs --root .
