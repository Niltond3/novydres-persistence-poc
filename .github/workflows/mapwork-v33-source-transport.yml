name: Mapwork V3.3 temporary source transport for local validation
on:
  push:
    branches: ['mapwork-v3/v33-agent-pipeline-20261120']
    paths: ['.github/workflows/mapwork-v33-source-transport.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack exact candidate source (no model images or secret media)
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/mapwork-v33-source.tar.gz" \
            novydres/AGENTS.md \
            novydres/CONTEXT.md \
            novydres/catalogo.json \
            novydres/cenario/atlas-novydres/cartografia/mapwork-v3
          sha256sum "$RUNNER_TEMP/mapwork-v33-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: mapwork-v33-source-local-validation
          path: ${{ runner.temp }}/mapwork-v33-source.tar.gz
          retention-days: 1
          if-no-files-found: error
