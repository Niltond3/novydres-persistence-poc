name: NOVYDRES CHR-001 C02 Causal Preflight V22 Exact SHA
on:
  push:
    paths:
      - '.github/workflows/novydres-m302-c02-preflight-v22.yml'
permissions:
  contents: read
jobs:
  causal_preflight_v22:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Exact final source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: V21 causal reviewer and negative suite
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_PREFLIGHT_TESTS_V21.mjs
      - name: V11 schema and negatives
        run: python novydres/runtime/orchestration/ORCHESTRATION_PREFLIGHT_SCHEMA_TESTS_V21.py
      - name: Full direct readback and source pins
        run: node novydres/runtime/orchestration/ORCHESTRATION_PREFLIGHT_V21.mjs
      - name: V20 G28 and temporal regression
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V20.mjs
