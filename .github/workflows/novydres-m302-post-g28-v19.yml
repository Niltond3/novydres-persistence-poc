name: NOVYDRES CHR-001 M3.02 post-G28 V19 candidate
on:
  push:
    paths:
      - '.github/workflows/novydres-m302-post-g28-v19.yml'
      - 'novydres/runtime/orchestration/*V19*'
      - 'novydres/runtime/orchestration/ORCHESTRATION_CONTRACT_V18.md'
      - 'novydres/runtime/orchestration/START_HERE_V17.md'
      - 'novydres/runtime/provocation-prep/*V10*'
      - 'novydres/chronicles/CHR-001/preparations/M3.02_*_V4.json'
      - 'novydres/MANIFEST_V61.json'
  pull_request:
    paths:
      - '.github/workflows/novydres-m302-post-g28-v19.yml'
      - 'novydres/runtime/orchestration/*V19*'
      - 'novydres/runtime/provocation-prep/*V10*'
      - 'novydres/chronicles/CHR-001/preparations/M3.02_*_V4.json'
      - 'novydres/MANIFEST_V61.json'
permissions:
  contents: read
jobs:
  post_g28_candidate_v19:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Post-G28 V19 semantics, negative and predecessor tests
        run: node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V19.mjs
      - name: Post-G28 V19 schemas and negative fixtures
        run: python novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V19.py
      - name: Post-G28 V19 exact blob pins and sources
        run: node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V19.mjs
      - name: Historical C44 G28 regressions preserved
        run: |
          node --test novydres/runtime/orchestration/ORCHESTRATION_TESTS_V18.mjs
          python novydres/runtime/orchestration/ORCHESTRATION_SCHEMA_TESTS_V18.py
          node novydres/runtime/orchestration/ORCHESTRATION_VALIDATOR_V18.mjs --root .
